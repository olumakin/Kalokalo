# DVPE Football Big 5 — hyperparameter configuration

leagues:
  E0: "English Premier League"
  SP1: "La Liga"
  I1: "Serie A"
  D1: "Bundesliga"
  F1: "Ligue 1"

data_source:
  historical_base_url: "https://www.football-data.co.uk/mmz4281/{season}/{league}.csv"
  cache_dir: "data/historical"
  fixtures_dir: "data/fixtures"

model:
  # Rolling training window, in days (~2 seasons)
  rolling_window_days: 730
  min_matches_for_team_rating: 15
  # Time-decay rate; grid-searched in [0.003, 0.010] during walk-forward validation
  xi_decay: 0.0065
  xi_grid: [0.003, 0.004, 0.005, 0.0065, 0.008, 0.010]
  goal_grid_size: 10
  max_optimizer_iterations: 500
  optimizer_method: "L-BFGS-B"
  rho_init: -0.05

devig:
  method: "multiplicative"   # "multiplicative" | "shin"

edge:
  min_ev: 0.03
  kelly_fraction: 0.15
  single_match_cap: 0.025
  daily_slate_cap: 0.08
  # Notional bankroll unit recorded alongside each shadow stake
  # (predictions.bankroll_at_slate) -- there's no real bankroll-tracking
  # system yet, so stakes stay expressed as a fraction of this single
  # placeholder unit, same as stake_pct always has been.
  shadow_bankroll_units: 1.0
  # Per-league multiplier applied to the raw Kelly stake before the
  # exposure caps (src.analytics.edge.apply_risk_caps), separate from
  # kelly_fraction's own fixed fractional-Kelly knob above. The WP3
  # gate-evaluation harness (src/validation/gate_harness.py) found
  # D1's draw-probability calibration slope stuck at ~0.4-0.45 even
  # after a walk-forward recalibration fix and an alternate rolling-
  # calibration-window fit -- CLV clears (the picks are real), but
  # the model is still overconfident about by how much, and Kelly
  # sizing takes that confidence at face value. Halving D1's stake is
  # a stopgap against that specific, measured weakness, not a general
  # risk dial -- a league absent from this map gets 1.0 (no discount).
  calibration_stake_multiplier:
    D1: 0.5
